<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="128" fill="url(#hmsGrad)" />
  <!-- Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />
  <!-- Medical Cross with Shadow -->
  <g filter="url(#glow)">
    <rect x="206" y="112" width="100" height="288" rx="24" fill="#ffffff" />
    <rect x="112" y="206" width="288" height="100" rx="24" fill="#ffffff" />
  </g>
  <!-- Center Heartbeat / Pulse Accent -->
  <path d="M196 256h24l16-36 24 72 20-44 12 16h24" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
